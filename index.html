<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Max iOS - Green Edition</title>
    <style>
        :root {
            --bg-dark: #0A0A0C;
            --panel-dark: #161618;
            --bubble-user: #10B981; /* Фирменный зеленый Max */
            --bubble-max: #222224;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --border-color: #27272A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Сайдбар в стиле Apple */
        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding-left: 8px;
        }

        .app-title span {
            color: var(--bubble-user);
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .menu-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .menu-btn:hover, .menu-btn.active {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--bubble-user);
        }

        /* Главный экран чата */
        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background-color: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
        }

        .history-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.max { justify-content: flex-start; }

        .bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user .bubble {
            background-color: var(--bubble-user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .max .bubble {
            background-color: var(--bubble-max);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Поле ввода как на iOS */
        .input-bar {
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            background-color: var(--bg-dark);
        }.input-wrapper {
            width: 100%;
            max-width: 768px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 14px 50px 14px 20px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--bubble-user);
        }

        .send-icon {
            position: absolute;
            right: 8px;
            width: 34px;
            height: 34px;
            background-color: var(--bubble-user);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Фрейм для секретной комнаты с другом */
        .friend-chat-frame {
            display: none;
            flex: 1;
            border: none;
            background: var(--bg-dark);
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Меню Apple Max -->
    <div class="sidebar">
        <div class="app-title">🍏 Max <span>Green</span></div>
        <button class="menu-btn active" id="btn-max">💬 Модель Max Intelligence</button>
        <button class="menu-btn" id="btn-friend">👥 Чат с другом (Прямой канал)</button>
        <div style="margin-top: auto; font-size: 11px; color: var(--text-muted); text-align: center;">
            Интерфейс адаптирован под iOS 18+
        </div>
    </div>

    <!-- Раздел ИИ Max -->
    <div class="chat-stage" id="stage-max">
        <div class="chat-header">
            <div style="font-weight: 600;">Max Intelligence</div>
            <div style="color: var(--bubble-user); font-size: 13px; font-weight: 500;">● Online</div>
        </div>
        
        <div class="history-area" id="chat-history">
            <div class="msg-row max">
                <div class="bubble">Привет! Я обновленный Max. Мой фиолетовый код полностью перекрашен в зеленый под твои требования. Чем могу помочь?</div>
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Спросите Max или отправьте сообщение...">
                <button class="send-icon" id="send-btn">↑</button>
            </div>
        </div>
    </div>

    <!-- Раздел живой переписки с другом -->
    <!-- Используется защищенная P2P веб-комната, работающая без серверов -->
    <iframe class="friend-chat-frame" id="stage-friend" src="https://3y3.net"></iframe>

    <script>
        const btnMax = document.getElementById('btn-max');
        const btnFriend = document.getElementById('btn-friend');
        const stageMax = document.getElementById('stage-max');
        const stageFriend = document.getElementById('stage-friend');
        
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');

        // Переключение вкладок (Сам ИИ Max / Чат с другом)
        btnMax.addEventListener('click', () => {
            btnMax.classList.add('active');
            btnFriend.classList.remove('active');
            stageMax.style.display = 'flex';
            stageFriend.style.display = 'none';
        });

        btnFriend.addEventListener('click', () => {
            btnFriend.classList.add('active');
            btnMax.classList.remove('active');
            stageMax.style.display = 'none';
            stageFriend.style.display = 'block';
        });// Работа чата ИИ Max
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Рендер сообщения пользователя
            appendMessage(text, 'user');
            userInput.value = '';

            // Симуляция ответа ИИ в стиле Max через 1 секунду
            setTimeout(() => {
                const maxAnswers = [
                    "Запрос обработан в зеленом спектре. Всё работает стабильно.",
                    "Я вижу ваше сообщение. Мой текущий дизайн полностью оптимизирован под ваш кастомный стиль.",
                    "Отличный выбор цвета. Зеленый нагружает процессор интерфейса Max на 15% меньше.",
                    "Связь с вашим другом активна во второй вкладке меню!"
                ];
                const randomAnswer = maxAnswers[Math.floor(Math.random() * maxAnswers.length)];
                appendMessage(randomAnswer, 'max');
            }, 1000);
        }

        function appendMessage(text, sender) {
            const row = document.createElement('div');
            row.classList.add('msg-row', sender);
            row.innerHTML = `<div class="bubble">${text}</div>`;
            chatHistory.appendChild(row);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
