<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smax</title>
    <style>
        :root {
            --bg-dark: #0A0A0C;
            --panel-dark: #161618;
            --accent-green: #10B981; /* Зеленый цвет для S */
            --text-main: #F4F4F5; /* Белый цвет для max */
            --text-muted: #A1A1AA;
            --border-color: #27272A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Боковая панель iOS */
        .sidebar {
            width: 280px;
            background-color: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
        }

        /* Кастомный логотип 🍏 Smax без пробелов */
        .app-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 24px;
            padding-left: 8px;
            color: var(--text-main);
        }

        .app-title .logo-s {
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .menu-btn {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        /* Главная зона чата */
        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background-color: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
        }

        .status-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Фрейм защищенного чата Element */
        .chat-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg-dark);
        }

        @media (max-width: 768px) {
            .sidebar { display: none; } /* Скрытие меню на iPhone для удобства */
        }
    </style>
</head>
<body>

    <!-- Сайдбар Smax -->
    <div class="sidebar">
        <div class="app-title">🍏<span class="logo-s">S</span>max</div>
        <button class="menu-btn">🟢 Основная комната</button>
        <div style="margin-top: auto; font-size: 11px; color: var(--text-muted); text-align: center;">
            Приватный зашифрованный канал
        </div>
    </div>

    <!-- Основное окно общения -->
    <div class="chat-stage">
        <div class="chat-header">
            <div style="font-weight: 600; display: flex; align-items: center; gap: 4px;">🍏<span style="color: var(--accent-green)">S</span>max Chat
            </div>
            <div class="status-block">
                <div class="status-dot"></div>
                <span style="color: var(--text-muted);">Защищено</span>
            </div>
        </div>
        
        <!-- Надежный и бесплатный веб-чат, который откроется внутри вашего дизайна -->
        <iframe class="chat-frame" src="https://element.io"></iframe>
    </div>

</body>
</html>
